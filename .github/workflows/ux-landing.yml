name: UX landing acceptance
on:
  pull_request:
    branches: [main]
    paths: ['landing/**', 'scripts/ux-landing/**', '.github/workflows/ux-landing.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/ux-landing/test.mjs
      - run: |
          npm install --prefix /tmp/ux-tools --no-audit --no-fund playwright@1.51.0
          /tmp/ux-tools/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          git worktree add /tmp/ux-baseline 4a1359a7b894651c158d03fe67bb806dc0b36c3f
      - name: Capture and assert real landing before and after
        env:
          UX_TOOLS_DIR: /tmp/ux-tools
          UX_BASE_DIR: /tmp/ux-baseline
        run: node scripts/ux-landing/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-landing-evidence-${{ github.event.pull_request.head.sha }}
          path: ux-evidence
          if-no-files-found: error
